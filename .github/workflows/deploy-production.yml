name: Deploy to GitHub Pages (Production)

# Publishes the client app to https://williambagel.github.io/onshape-node-editor/
#
# That URL is what Onshape loads as the extension's app element, so this job
# runs the same checks as CI before it uploads: a published build is reachable
# by users, and a type error or a failing test must not get there.
#
# The Pages site is published from the ARTIFACT uploaded below (the repository's
# Pages settings use build_type=workflow). Nothing is committed to a branch -
# pushing build output to `gh-pages` changes nothing on the live site.
#
# Trigger: push to master, or `pnpm run deploy:app` / `gh workflow run` against a
# ref that is already on GitHub.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# No repository write access is needed: the deploy consumes an artifact and
# talks to the Pages service, it does not push a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes overlap; the newer commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'  # pnpm 11.22 requires Node >= 22.13; engines allow >= 22.12

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0  # matches packageManager in package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: steps.pnpm-cache.outputs.STORE_PATH != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Audit gate
        run: pnpm run audit:gate

      - name: Type-check gate
        run: pnpm run type-check:gate

      - name: Build application
        run: pnpm run build:app

      - name: Build server
        run: pnpm run build:server

      - name: Server orphan check (#40)
        run: pnpm run check:server-orphans

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './dist/app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
