name: Deploy to GitHub Pages (Production)

# Publishes the client app to https://williambagel.github.io/onshape-node-editor/
#
# That URL is what Onshape loads as the extension's app element, so this job
# runs the same checks as CI before it uploads: a published build is reachable
# by users, and a type error or a failing test must not get there.
#
# The Pages site is published from the ARTIFACT uploaded below (the repository's
# Pages settings use build_type=workflow). Nothing is committed to a branch -
# pushing build output to `gh-pages` changes nothing on the live site.
#
# Trigger: push to master, or `pnpm run deploy:app` / `gh workflow run` against a
# ref that is already on GitHub.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# No repository write access is needed: the deploy consumes an artifact and
# talks to the Pages service, it does not push a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes overlap; the newer commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type-check gate
        run: pnpm run type-check:gate

      - name: Build application
        run: pnpm run build:app

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
