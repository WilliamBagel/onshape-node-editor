name: CodeQL

# Static analysis over the TypeScript tree (#52). This workflow only reports to
# the code-scanning tab; it cannot break the CI or deploy jobs, and it is not a
# required status check.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7aa4d48f0aaa9b8ac3ea6a74fb54295f540febb8 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@7aa4d48f0aaa9b8ac3ea6a74fb54295f540febb8 # v3

      - name: Analyze
        uses: github/codeql-action/analyze@7aa4d48f0aaa9b8ac3ea6a74fb54295f540febb8 # v3
        with:
          category: '/language:javascript-typescript'
