name: CI

# Pull-request checks: install, type-check, unit tests, both builds.
#
# Deliberately separate from deploy-production.yml, which stays default-branch
# only (a PR must never be able to deploy).
#
# type-check is the gated `pnpm run type-check:gate` (vue-tsc over all three projects,
# with no exemptions: issue #24 patched the one dependency that used to report 25
# errors, so the compiler is now clean repo-wide and every error should fail the
# job. If a dependency ever regresses, the fix is a patch under patches/ (see
# pnpm-workspace.yaml), not a filter here.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'  # pnpm 11.22 requires Node >= 22.13; engines allow >= 22.12

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0  # matches packageManager in package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: steps.pnpm-cache.outputs.STORE_PATH != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Type-check"
        run: pnpm run type-check:gate

      - name: Style guide gate (#33)
        run: pnpm run style-check

      - name: Unit tests
        run: pnpm test

      - name: Dashboard controls smoke test
        run: |
          node --check qa/dashboard/dashboard.smoke.mjs
          pnpm run build:qa-dashboard
          node qa/dashboard/dashboard.smoke.mjs

      - name: Build application
        run: pnpm run build:app

      - name: Build server
        run: pnpm run build:server

      - name: Server orphan check (#40)
        run: pnpm run check:server-orphans

      - name: Dependency audit gate (#46)
        run: pnpm run audit:gate

      - name: Server-lock audit (#46)
        working-directory: scripts/server-lock
        run: npm audit --omit=dev --audit-level=moderate

  # Exploratory UI QA on every pull request. The dashboard is published as a
  # workflow artifact even when it finds product gaps; a harness crash still
  # fails the job. Master deployments publish the same report at /qa/.
  ui-qa:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pillow for screenshot annotations
        run: python3 -m pip install --user --break-system-packages pillow

      - name: Serve the app for exploratory UI QA
        run: |
          pnpm exec vite --port 5173 --strictPort --host 127.0.0.1 > /tmp/ui-preview.log 2>&1 &
          echo $! > /tmp/ui-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/onshape-node-editor/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ui-preview.log
          exit 1

      - name: Node chrome regression check
        env:
          QA_URL: http://127.0.0.1:5173/onshape-node-editor/
        run: pnpm run qa:node-chrome

      - name: Defect checks (group wires + palette; advisory)
        env:
          QA_URL: http://127.0.0.1:5173/onshape-node-editor/
        run: pnpm run qa:defects -- --advisory --out tmp/qa-runs/defects-${{ github.run_id }}

      - name: Explore the UI and build the QA dashboard
        run: |
          pnpm run explore:ui -- \
            --url http://127.0.0.1:5173/onshape-node-editor/ \
            --out tmp/qa-runs/${{ github.run_id }} \
            --task make-filleted-cylinder \
            --max-actions 40 \
            --advisory
          pnpm run build:qa-dashboard
          mkdir -p dist/app/qa/data
          cp -r dist/qa-dashboard/. dist/app/qa/
          cp tmp/qa-runs/${{ github.run_id }}/report.json dist/app/qa/data/report.json
          cp -r tmp/qa-runs/${{ github.run_id }}/screenshots dist/app/qa/data/screenshots
          if [ -d tmp/qa-runs/${{ github.run_id }}/annotated ]; then cp -r tmp/qa-runs/${{ github.run_id }}/annotated dist/app/qa/data/annotated; fi

      - name: Upload UI QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qa-report-${{ github.run_id }}
          path: |
            dist/app/qa
            tmp/qa-runs/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the UI QA server
        if: always()
        run: |
          if [ -f /tmp/ui-preview.pid ]; then kill "$(cat /tmp/ui-preview.pid)" 2>/dev/null || true; fi
          pkill -f 'vite --port 5173' 2>/dev/null || true
