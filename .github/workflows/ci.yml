name: CI

# Pull-request checks: install, type-check, unit tests, both builds.
#
# Deliberately separate from deploy-production.yml, which stays default-branch
# only (a PR must never be able to deploy).
#
# type-check is the raw `pnpm run type-check` (vue-tsc over all three projects),
# with no exemptions: issue #24 patched the one dependency that used to report 25
# errors, so the compiler is now clean repo-wide and every error should fail the
# job. If a dependency ever regresses, the fix is a patch under patches/ (see
# pnpm-workspace.yaml), not a filter here.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Type-check"
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm test

      - name: Build application
        run: pnpm run build:app

      - name: Build server
        run: pnpm run build:server
