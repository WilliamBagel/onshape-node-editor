<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vite App</title>
  <link href="./common.css" type="text/css" rel="stylesheet">
</head>

<body>
  <span class="osc-svgmin-container" style="width: 0px; height: 0px; display: block;">
  </span>
  <div id="app"></div>
  <script type="module">
    // #28: the SVG sprite used to be inlined into this file at build time
    // (a ~1.5 MB blob). It is now a cacheable static file copied to dist by
    // vite.config.ts (copyOnshapeAssets); fetch + inject it so same-document
    // <use href="#svg-icon-..."> references keep working.
    fetch('./onshape/icons.svg')
      .then((r) => r.text())
      .then((svg) => {
        const clean = svg
          .replace(/<\?xml[^>]*\?>/, '')
          .replace(/<!DOCTYPE[^>]*>/, '');
        const container = document.querySelector('.osc-svgmin-container');
        if (container) container.innerHTML = clean;
      })
      .catch(() => {
        // icons are decorative; the app must still boot without them
      });
  </script>
  <script type="module" src="./main.ts"></script>
</body>

</html>
